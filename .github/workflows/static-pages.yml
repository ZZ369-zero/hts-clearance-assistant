name: Static data and GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      scope:
        description: "Data export scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - hts
          - policyRules
          - forcedLabor301
          - forcedLaborExemptions
          - section122
          - section232
          - adcvd
          - cotton
          - epaFlags
          - fdaFlags
          - translations
      translation_limit:
        description: "Maximum Chinese descriptions to translate in a manual run"
        required: false
        default: "200"
        type: string
      translation_chunk_size:
        description: "Checkpoint size for long Chinese translation runs"
        required: false
        default: "20"
        type: string
      translation_model:
        description: "Copilot CLI model for initial Chinese translations"
        required: false
        default: "copilot-default"
        type: string
      review_model:
        description: "Copilot CLI model for independent Chinese translation review"
        required: false
        default: "copilot-default"
        type: string
      auto_continue:
        description: "Queue another translation run when calibrated descriptions remain"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # HTS / normal duty / Chapter 99: every 1 hour.
    - cron: "7 * * * *"
    # Section 122 Annex II exclusions: every 24 hours.
    - cron: "57 1 * * *"
    # 232 Metals HTS List: every 6 hours.
    - cron: "17 */6 * * *"
    # AD/CVD official monitor and static match snapshot: every 24 hours.
    - cron: "27 2 * * *"
    # EPA EP3/EP5 and FDA FD1-FD4 HTS flag lists: every 24 hours.
    - cron: "47 2 * * *"
    # Cotton Import Assessment: every 24 hours.
    - cron: "37 3 * * *"
    # Chinese description cache: daily until full coverage, then incremental.
    - cron: "47 4 * * *"

permissions:
  contents: write
  actions: write
  copilot-requests: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: "pages-static-data"
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'translation-validation' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data parser dependencies
        run: python -m pip install xlrd==2.0.2 pypdf==6.14.2

      - name: Resolve export scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "7 * * * *") scope="hts,policyRules,forcedLabor301,forcedLaborExemptions" ;;
              "57 1 * * *") scope="section122" ;;
              "17 */6 * * *") scope="section232" ;;
              "27 2 * * *") scope="adcvd" ;;
              "47 2 * * *") scope="epaFlags,fdaFlags" ;;
              "37 3 * * *") scope="cotton" ;;
              "47 4 * * *") scope="translations" ;;
              *) scope="all" ;;
            esac
          else
            scope="all"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Export scope: $scope"

      - name: Export static data
        run: node scripts/export-static-data.js --scope "${{ steps.scope.outputs.scope }}"

      - name: Install GitHub Copilot CLI
        if: github.event_name != 'push' && (contains(steps.scope.outputs.scope, 'translations') || steps.scope.outputs.scope == 'all')
        run: npm install -g @github/copilot@1.0.78 --no-audit --no-fund

      - name: Generate and validate Chinese descriptions
        if: github.event_name != 'push' && (contains(steps.scope.outputs.scope, 'translations') || steps.scope.outputs.scope == 'all')
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_TRANSLATION_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_model || 'copilot-default' }}
          COPILOT_REVIEW_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.review_model || 'copilot-default' }}
          COPILOT_MAX_AI_CREDITS: "30"
          TRANSLATION_BATCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_limit || '200' }}
          TRANSLATION_BATCH_SIZE: "40"
          TRANSLATION_CHUNK_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_chunk_size || '20' }}
          TRANSLATION_QUALITY_CYCLES: "2"
          COPILOT_REQUEST_RETRIES: "3"
          AUTO_CONTINUE_TRANSLATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_continue || 'true' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/translate-descriptions-github-models.js --self-test

          target="${TRANSLATION_BATCH_LIMIT:-2000}"
          chunk="${TRANSLATION_CHUNK_SIZE:-400}"
          if ! [[ "$target" =~ ^[0-9]+$ ]]; then target=2000; fi
          if ! [[ "$chunk" =~ ^[0-9]+$ ]]; then chunk=400; fi
          if [ "$target" -lt 1 ]; then target=1; fi
          if [ "$chunk" -lt 1 ]; then chunk=1; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          processed=0
          run_accepted_total=0
          while [ "$processed" -lt "$target" ]; do
            current="$chunk"
            remaining=$((target - processed))
            if [ "$current" -gt "$remaining" ]; then current="$remaining"; fi

            echo "Translation checkpoint: processing up to $current descriptions ($processed/$target already requested)."
            if git diff --quiet; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
            else
              echo "Skipping pre-checkpoint pull because local exported data is pending."
            fi
            TRANSLATION_BATCH_LIMIT="$current" node scripts/translate-descriptions-github-models.js

            stats="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/data/manifest.json','utf8')); const s=(m.sources||[]).find(x=>x.id==='translations')?.state?.detail||{}; console.log([s.acceptedThisRun||0,s.deferredThisRun||0,s.pendingCalibration||0].join(','));")"
            IFS=',' read -r accepted deferred pending <<< "$stats"
            echo "Translation checkpoint stats: accepted=$accepted deferred=$deferred pendingCalibration=$pending"
            if [[ "$accepted" =~ ^[0-9]+$ ]]; then
              run_accepted_total=$((run_accepted_total + accepted))
            fi
            if [ "$accepted" = "0" ]; then
              echo "No accepted translations in this checkpoint; stopping without committing attempt-only data."
              git restore -- public/data/manifest.json public/data/translations.json
              break
            fi

            git add public/data/manifest.json public/data/translations.json
            if git diff --cached --quiet; then
              echo "No translation cache changes to commit."
              break
            fi

            git commit -m "chore: update Chinese description translations [skip ci]"
            git push

            if [ "$pending" = "0" ]; then
              echo "Chinese description calibration is complete."
              break
            fi
            processed=$((processed + current))
          done

          final_stats="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/data/manifest.json','utf8')); const s=(m.sources||[]).find(x=>x.id==='translations')?.state?.detail||{}; console.log([s.acceptedThisRun||0,s.pendingCalibration||0].join(','));")"
          IFS=',' read -r final_accepted final_pending <<< "$final_stats"
          if [ "${AUTO_CONTINUE_TRANSLATIONS:-true}" = "true" ] && [ "$final_pending" != "0" ] && [ "$run_accepted_total" != "0" ]; then
            echo "Queueing continuation run: pendingCalibration=$final_pending; acceptedThisRun=$run_accepted_total"
            gh workflow run static-pages.yml \
              --ref "${GITHUB_REF_NAME}" \
              -f scope=translations \
              -f translation_limit="$target" \
              -f translation_chunk_size="$chunk" \
              -f translation_model="${COPILOT_TRANSLATION_MODEL:-copilot-default}" \
              -f review_model="${COPILOT_REVIEW_MODEL:-copilot-default}" \
              -f auto_continue=true
          fi

      - name: Run description translation checks
        run: npm run check:descriptions

      - name: Run HTS search ranking checks
        run: npm run check:search-ranking

      - name: Run certification rule checks
        run: npm run check:certifications

      - name: Run policy sentinel checks
        run: npm run check:policy-sentinel

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No static data changes to commit."
          else
            git commit -m "chore: update static data (${{ steps.scope.outputs.scope }}) [skip ci]"
            git push
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
